rules:
  - id: CASA3-OAU-01-ropc-grant
    languages: [typescript, javascript, python]
    message: "OAU-01: Prohibited OAuth 2.0 Resource Owner Password Credentials (ROPC) grant_type=password detected (RFC 9700 §2.4)"
    severity: ERROR
    pattern-either:
      - pattern-regex: '(?i)(?:grant_type\s*[:=]\s*["'']?password\b|["'']grant_type["'']\s*:\s*["'']password["'']|grant_type=password\b)'

  - id: CASA3-OAU-01-implicit-or-hybrid-flow
    languages: [typescript, javascript, python]
    message: "OAU-01: Prohibited OAuth 2.0 Implicit or Hybrid response_type (must strictly equal 'code' per RFC 9700 §2.1.2)"
    severity: ERROR
    pattern-either:
      - pattern-regex: 'response_type=(?:token|id_token|code(?:%20|\s|\+)token|code(?:%20|\s|\+)id_token|id_token(?:%20|\s|\+)token)\b'
      - pattern-regex: 'parseRedirectUrlParams\(\)\.access_token|googleapis\.com/oauth2/v1/userinfo\?alt=json&access_token='

  - id: CASA3-OAU-02-weak-or-plain-pkce
    languages: [typescript, javascript, python]
    message: "OAU-02: OAuth 2.0 authorization request omits RFC 7636 PKCE S256 parameters or uses prohibited plain method"
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern-regex: 'code_challenge_method\s*=\s*plain\b'
          - patterns:
              - pattern-regex: '[^\n]*\?client_id=[^\n]*redirect_uri=[^\n]*'
              - pattern-not-regex: 'code_challenge_method\s*=\s*S256\b'

  - id: CASA3-OAU-04-missing-state-or-weak-prng
    languages: [typescript, javascript, python]
    message: "OAU-04: OAuth 2.0 authorization request omits session-bound CSPRNG state or uses weak non-CSPRNG randomness (RFC 9700 §4.7; CWE-352)"
    severity: ERROR
    patterns:
      - pattern-either:
          - patterns:
              - pattern-regex: '[^\n]*\?client_id=[^\n]*redirect_uri=[^\n]*'
              - pattern-not-regex: 'state='
          - patterns:
              - pattern-regex: '[^\n]*(?:state[^\n]*Math\.random\(|Math\.random\([^\n]*state)[^\n]*'
              - pattern-not-regex: 'crypto\.(?:getRandomValues|randomUUID|randomBytes)'

  - id: CASA3-OAU-05-embedded-webview-oauth
    languages: [kotlin, java, swift, typescript, javascript]
    message: "OAU-05: Embedded WebView or prohibited SFSafariViewController used for OAuth authorization instead of system browser (RFC 8252 §8.12)"
    severity: ERROR
    pattern-either:
      - pattern-regex: '\b(?:WKWebView|UIWebView|SFSafariViewController|InAppBrowser)\b'
      - pattern-regex: '(?:android\.webkit\.WebView|\bWebView\b)'
      - pattern-regex: '\bnew\s+BrowserWindow\b|react-native-webview|<webview\b'

  - id: CASA3-OAU-06-embedded-client-secret
    languages: [kotlin, java, swift, typescript, javascript, json, yaml]
    message: "OAU-06: Public client binary/source embeds OAuth client_secret or issuer secret literal (RFC 8252 §8.5; CWE-798)"
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern-regex: '\b(?:GOCSPX-[A-Za-z0-9_-]{20,}|(?:gho|ghu|ghs)_[A-Za-z0-9]{20,})\b'
          - patterns:
              - pattern-regex: '(?:client[_-]?secret|clientSecret|CLIENT_SECRET|oauth_secret|consumer_secret)\s*[:=]\s*["''][^"''\n]{8,160}["'']'
              - pattern-not-regex: '(?i)(?:replace_me|your_client_secret|changeme|dummy_secret|placeholder|process\.env|\$\{|<client_secret>)'

  - id: CASA3-OAU-07-insecure-token-storage
    languages: [typescript, javascript, kotlin, java, swift]
    message: "OAU-07: Authentication/OAuth token persisted in localStorage, sessionStorage, or plaintext mobile preferences instead of Keystore/Keychain/HttpOnly Secure cookie (CWE-922)"
    severity: ERROR
    pattern-either:
      - pattern-regex: '(?:localStorage|sessionStorage)\.setItem\s*\(\s*["''`](?:token|access_token|refresh_token|id_token)["''`]'
      - pattern-regex: '\b(?:getSharedPreferences|SharedPreferences\.Editor|NSUserDefaults|UserDefaults\.standard)\b'

  - id: CASA3-OAU-08-token-in-url-transport
    languages: [typescript, javascript]
    message: "OAU-08: Access token transmitted or parsed in URL query string or fragment instead of Authorization Bearer/DPoP header (RFC 6750 §2.3)"
    severity: ERROR
    pattern-either:
      - pattern-regex: '(?:https?://[^\s''"`]+|\$\{[^}]+\})[^\n''"`]*\?(?:[^\n''"`]*&)?access_token='
      - pattern-regex: '#access_token=|parseRedirectUrlParams\(\)\.access_token'

  - id: CASA3-OAU-09-jwt-validation-weakness
    languages: [typescript, javascript, python]
    message: "OAU-09: Backend JWT verification lacks explicit algorithms allowlist / issuer / audience enforcement (RFC 8725 / CWE-347)"
    severity: ERROR
    patterns:
      - pattern-either:
          - patterns:
              - pattern-regex: '[^\n]*(?:expressJwt|express_jwt)\s*\([^\n]*publicKey[^\n]*'
              - pattern-not-regex: 'algorithms'
          - patterns:
              - pattern-regex: '[^\n]*jwt\.verify\([^\n]*publicKey[^\n]*'
              - pattern-not-regex: 'algorithms'

  - id: CASA3-WHK-01-cleartext-webhook-url
    languages: [typescript, javascript, python, yaml, json]
    message: "WHK-01: Cleartext HTTP webhook endpoint URL configured instead of HTTPS TLS 1.2+ (CASA v2.1.1 §7.1.1)"
    severity: ERROR
    pattern-regex: '(?i)(?:webhook[_-]?url|webhookUrl|callback[_-]?url|callbackUrl|webhookEndpoint)\s*[:=]\s*["'']http://[^"''\s]+["'']'

  - id: CASA3-WHK-02-weak-hmac-or-timing
    languages: [typescript, javascript, python]
    message: "WHK-02: Webhook handler uses weak HMAC (< SHA-256) or variable-time signature comparison (CASA v2.1.1 §7.2.1; CWE-208)"
    severity: ERROR
    pattern-either:
      - pattern-regex: '(?i)(?:createHmac\s*\(\s*["''](?:sha1|md5)["'']|hmac\.new\s*\([^\n]*(?:hashlib\.(?:sha1|md5)|["''](?:sha1|md5)["'']))'
      - patterns:
          - pattern-regex: '[^\n]*(?:\b(?:sig|signature|expected|computed|hmac_val|webhook_sig)\w*\s*(?:===|!==|==|!=)\s*\w+|Buffer\.compare\s*\()[^\n]*'
          - pattern-not-regex: '(?:timingSafeEqual|compare_digest|MessageDigest\.isEqual|ConstantTimeCompare|ConstantTimeEquals)'
