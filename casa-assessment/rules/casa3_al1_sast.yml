rules:
  - id: CASA3-SAST-01-hardcoded-secret
    languages: [typescript, javascript, python]
    message: "SAST-01: Hardcoded password, API key, HMAC secret, JWT signing secret or credential in source code (CWE-798)"
    severity: ERROR
    pattern-either:
      - pattern: |
          const $KEY = '-----BEGIN RSA PRIVATE KEY-----...'
      - pattern: |
          jwt.sign($PAYLOAD, "...", ...)
      - pattern: |
          crypto.createHmac($ALG, "...")
      - pattern: |
          $REQ.body.password === "..."
      - pattern: |
          { [Op.like]: '%6PPi37DBxP4lDwlriuaxP15HaDJpsUXY5TspVmie%' }

  - id: CASA3-SAST-02-committed-private-key
    languages: [typescript, javascript, python]
    message: "SAST-02: Private key, HDWallet BIP-39 mnemonic seed or trust material committed in source code (CWE-321)"
    severity: ERROR
    pattern-either:
      - pattern-regex: "-----BEGIN (RSA |EC |OPENSSH |DSA |ENCRYPTED )?PRIVATE KEY-----"
      - pattern: HDNodeWallet.fromPhrase("...")
      - pattern: ethers.Wallet.fromPhrase("...")

  - id: CASA3-SAST-03-weak-cipher
    languages: [typescript, javascript]
    message: "SAST-03: Deprecated or broken cipher algorithm (DES, 3DES, RC4, Blowfish) or insecure ECB mode (CWE-327)"
    severity: ERROR
    pattern-either:
      - pattern: crypto.createCipher($ALG, ...)
      - pattern: crypto.createDecipher($ALG, ...)
      - pattern: CryptoJS.DES.encrypt(...)
      - pattern: CryptoJS.DES.decrypt(...)
      - pattern: CryptoJS.TripleDES.encrypt(...)
      - pattern: CryptoJS.TripleDES.decrypt(...)
      - pattern: CryptoJS.RC4.encrypt(...)
      - pattern: CryptoJS.RC4.decrypt(...)
      - pattern: CryptoJS.RC4Drop.encrypt(...)
      - pattern: CryptoJS.RC4Drop.decrypt(...)
      - pattern: CryptoJS.Blowfish.encrypt(...)
      - pattern: CryptoJS.Blowfish.decrypt(...)
      - pattern-regex: "(?i)(?:createCipheriv|createDecipheriv)\\s*\\(\\s*['\"](?:des|des3|des-ede|des-ede3|desx|rc4|bf|blowfish|[a-z0-9-]+-ecb)"
      - pattern-regex: "(?i)CryptoJS\\.mode\\.ECB"
      - pattern-regex: "(?i)forge\\.cipher\\.create(?:Cipher|Decipher)\\s*\\(\\s*['\"](?:DES|3DES|AES-ECB|RC2)"

  - id: CASA3-SAST-03-weak-cipher-python
    languages: [python]
    message: "SAST-03: Deprecated or broken cipher algorithm (DES, 3DES, RC4, Blowfish) or insecure ECB mode in Python (CWE-327)"
    severity: ERROR
    pattern-either:
      - pattern: Crypto.Cipher.DES.new(...)
      - pattern: Crypto.Cipher.DES3.new(...)
      - pattern: Crypto.Cipher.ARC4.new(...)
      - pattern: Crypto.Cipher.Blowfish.new(...)
      - pattern: Cryptodome.Cipher.DES.new(...)
      - pattern: Cryptodome.Cipher.DES3.new(...)
      - pattern: Cryptodome.Cipher.ARC4.new(...)
      - pattern: Cryptodome.Cipher.Blowfish.new(...)
      - pattern: AES.new($KEY, AES.MODE_ECB, ...)
      - pattern: cryptography.hazmat.primitives.ciphers.modes.ECB()
      - pattern: cryptography.hazmat.primitives.ciphers.algorithms.TripleDES(...)
      - pattern: cryptography.hazmat.primitives.ciphers.algorithms.Blowfish(...)
      - pattern: cryptography.hazmat.primitives.ciphers.algorithms.ARC4(...)
      - pattern: cryptography.hazmat.decrepit.ciphers.algorithms.TripleDES(...)
      - pattern: cryptography.hazmat.decrepit.ciphers.algorithms.Blowfish(...)
      - pattern: cryptography.hazmat.decrepit.ciphers.algorithms.ARC4(...)
      - pattern: cryptography.hazmat.decrepit.ciphers.algorithms.IDEA(...)

  - id: CASA3-SAST-03-weak-cipher-java
    languages: [java]
    message: "SAST-03: Deprecated or broken cipher algorithm (DES, DESede/3DES, RC4, Blowfish) or insecure ECB mode in Java JCE (CWE-327)"
    severity: ERROR
    pattern-regex: "(?i)Cipher\\.getInstance\\s*\\(\\s*\"(?:DES|DESede|TripleDES|RC4|ARCFOUR|Blowfish|[^\"]*\\/ECB\\/[^\"]*|AES)\""

  - id: CASA3-SAST-03-weak-cipher-go
    languages: [go]
    message: "SAST-03: Deprecated or broken cipher algorithm (DES, 3DES, RC4, Blowfish) in Go (CWE-327)"
    severity: ERROR
    pattern-either:
      - pattern: des.NewCipher(...)
      - pattern: des.NewTripleDESCipher(...)
      - pattern: rc4.NewCipher(...)
      - pattern: blowfish.NewCipher(...)
      - pattern: blowfish.NewSaltedCipher(...)

  - id: CASA3-SAST-03-weak-cipher-csharp
    languages: [csharp]
    message: "SAST-03: Deprecated or broken cipher algorithm (DES, 3DES, RC2) or insecure CipherMode.ECB in .NET/C# (CWE-327)"
    severity: ERROR
    pattern-either:
      - pattern: new DESCryptoServiceProvider(...)
      - pattern: new TripleDESCryptoServiceProvider(...)
      - pattern: new RC2CryptoServiceProvider(...)
      - pattern: DES.Create(...)
      - pattern: TripleDES.Create(...)
      - pattern-regex: "\\bCipherMode\\.ECB\\b"

  - id: CASA3-SAST-04-weak-hash-taint-js
    languages: [typescript, javascript]
    mode: taint
    message: "SAST-04: Data-flow taint path from weak hash (MD5/SHA-1) into security-relevant sink (password, token, signature, key derivation, or integrity check) (CWE-328)"
    severity: ERROR
    pattern-sources:
      - pattern: crypto.createHash('md5')
      - pattern: crypto.createHash('sha1')
      - pattern: crypto.createHmac('md5', ...)
      - pattern: crypto.createHmac('sha1', ...)
      - pattern: CryptoJS.MD5(...)
      - pattern: CryptoJS.SHA1(...)
    pattern-sanitizers:
      - pattern: etag = $X
      - pattern: ETag = $X
      - pattern: cacheKey = $X
      - pattern: cache_key = $X
      - pattern: $RES.setHeader("ETag", $X)
      - pattern: $RES.set("ETag", $X)
    pattern-sinks:
      - pattern: |
          { ..., password: $SINK, ... }
      - pattern: |
          { ..., token: $SINK, ... }
      - pattern: |
          { ..., signature: $SINK, ... }
      - pattern: |
          { ..., hmac: $SINK, ... }
      - pattern: |
          { ..., secret: $SINK, ... }
      - pattern: |
          { ..., integrity: $SINK, ... }
      - pattern: |
          { ..., checksum: $SINK, ... }
      - pattern: password = $SINK
      - pattern: token = $SINK
      - pattern: signature = $SINK
      - pattern: secret = $SINK
      - pattern: derivedKey = $SINK
      - pattern: jwt.sign($SINK, ...)
      - pattern: $RES.cookie($NAME, $SINK, ...)
      - pattern: crypto.timingSafeEqual($SINK, ...)
      - pattern: verify($SINK, ...)

  - id: CASA3-SAST-04-weak-hash
    languages: [typescript, javascript]
    message: "SAST-04: Weak hash function (MD5 or SHA-1) used in security-relevant signature, HMAC, or auth wrapper context (CWE-328)"
    severity: ERROR
    pattern-either:
      - pattern: crypto.createHmac('md5', ...)
      - pattern: crypto.createHmac('sha1', ...)
      - pattern: |
          export const hash = ($DATA) => crypto.createHash('md5').update($DATA).digest(...)
      - pattern: |
          export const hash = ($DATA) => crypto.createHash('sha1').update($DATA).digest(...)
      - pattern: security.hash(...)

  - id: CASA3-SAST-04-weak-hash-taint-python
    languages: [python]
    mode: taint
    message: "SAST-04: Data-flow taint path from weak hash (MD5/SHA-1) into security-relevant sink in Python (CWE-328)"
    severity: ERROR
    pattern-sources:
      - pattern: hashlib.md5(...)
      - pattern: hashlib.sha1(...)
      - pattern: hmac.new($KEY, $MSG, hashlib.md5)
      - pattern: hmac.new($KEY, $MSG, hashlib.sha1)
    pattern-sanitizers:
      - pattern: etag = $X
      - pattern: cache_key = $X
    pattern-sinks:
      - pattern: password = $SINK
      - pattern: password_hash = $SINK
      - pattern: token = $SINK
      - pattern: signature = $SINK
      - pattern: secret = $SINK
      - pattern: derived_key = $SINK
      - pattern: integrity = $SINK
      - pattern: checksum = $SINK
      - pattern: hmac.compare_digest($SINK, ...)
      - pattern: |
          { ..., "password": $SINK, ... }
      - pattern: |
          { ..., "token": $SINK, ... }
      - pattern: |
          { ..., "signature": $SINK, ... }

  - id: CASA3-SAST-04-weak-hash-python
    languages: [python]
    message: "SAST-04: Weak hash function (MD5 or SHA-1) used in HMAC signature context in Python (CWE-328)"
    severity: ERROR
    pattern-either:
      - pattern: hmac.new($KEY, $MSG, hashlib.md5)
      - pattern: hmac.new($KEY, $MSG, hashlib.sha1)

  - id: CASA3-SAST-04-weak-hash-taint-java
    languages: [java]
    mode: taint
    message: "SAST-04: Data-flow taint path from weak hash (MD5/SHA-1) into security-relevant sink in Java (CWE-328)"
    severity: ERROR
    pattern-sources:
      - pattern: MessageDigest.getInstance("MD5")
      - pattern: MessageDigest.getInstance("SHA-1")
      - pattern: MessageDigest.getInstance("SHA1")
    pattern-sanitizers:
      - pattern: etag = $X
      - pattern: cacheKey = $X
    pattern-sinks:
      - pattern: password = $SINK
      - pattern: passwordHash = $SINK
      - pattern: token = $SINK
      - pattern: signature = $SINK
      - pattern: MessageDigest.isEqual($SINK, ...)

  - id: CASA3-SAST-04-weak-hash-taint-go
    languages: [go]
    mode: taint
    message: "SAST-04: Data-flow taint path from weak hash (MD5/SHA-1) into security-relevant sink in Go (CWE-328)"
    severity: ERROR
    pattern-sources:
      - pattern: md5.New()
      - pattern: sha1.New()
      - pattern: md5.Sum(...)
      - pattern: sha1.Sum(...)
    pattern-sanitizers:
      - pattern: etag = $X
      - pattern: cacheKey = $X
    pattern-sinks:
      - pattern: password = $SINK
      - pattern: password := $SINK
      - pattern: token = $SINK
      - pattern: token := $SINK
      - pattern: signature = $SINK
      - pattern: signature := $SINK
      - pattern: secret = $SINK
      - pattern: secret := $SINK
      - pattern: subtle.ConstantTimeCompare($SINK, ...)
      - pattern: subtle.ConstantTimeCompare($SINK[:], ...)

  - id: CASA3-SAST-04-weak-hash-go
    languages: [go]
    message: "SAST-04: Weak hash function (MD5 or SHA-1) used in HMAC signature context in Go (CWE-328)"
    severity: ERROR
    pattern-either:
      - pattern: hmac.New(md5.New, ...)
      - pattern: hmac.New(sha1.New, ...)

  - id: CASA3-SAST-04-weak-hash-informational
    languages: [typescript, javascript]
    message: "SAST-04: Informational non-security MD5/SHA-1 usage for ETag or cache key (not a security-relevant sink)"
    severity: INFO
    pattern-either:
      - pattern-regex: "(?i)\\b(?:etag|cache[_]?key)\\b[^\\n]{0,80}crypto\\.createHash\\(\\s*['\"](?:md5|sha1)['\"]"
      - pattern-regex: "(?i)setHeader\\(\\s*['\"]ETag['\"]\\s*,[^\\n]{0,80}crypto\\.createHash"

  - id: CASA3-SAST-04-weak-hash-informational-python
    languages: [python]
    message: "SAST-04: Informational non-security MD5/SHA-1 usage for ETag or cache key in Python"
    severity: INFO
    pattern-either:
      - pattern-regex: "(?i)\\b(?:etag|cache_key)\\s*=\\s*hashlib\\.(?:md5|sha1)\\("

  - id: CASA3-SAST-05-weak-password-kdf
    languages: [typescript, javascript]
    message: "SAST-05: Password persistence sink uses fast/unsalted hash or KDF parameters below NIST SP 800-63B §5.1.1.2 / ASVS V2.4.1 floor"
    severity: ERROR
    pattern-either:
      - pattern: |
          export const hash = ($DATA) => crypto.createHash('md5').update($DATA).digest('hex')
      - pattern: |
          this.setDataValue('password', $HASH_FN($PWD))
      - pattern: |
          crypto.pbkdf2Sync($PWD, "...", ...)
      - pattern: |
          crypto.pbkdf2($PWD, "...", ...)
      - pattern: crypto.pbkdf2Sync($PWD, $SALT, $ITERS, $KL, 'sha1', ...)
      - pattern: crypto.pbkdf2Sync($PWD, $SALT, $ITERS, $KL, 'md5', ...)
      - patterns:
          - pattern-either:
              - pattern: bcrypt.hash($PWD, $COST, ...)
              - pattern: bcrypt.hashSync($PWD, $COST)
              - pattern: bcrypt.genSalt($COST, ...)
              - pattern: bcrypt.genSaltSync($COST)
          - metavariable-comparison:
              metavariable: $COST
              comparison: $COST < 10
      - patterns:
          - pattern-either:
              - pattern: crypto.pbkdf2Sync($PWD, $SALT, $ITERS, ...)
              - pattern: crypto.pbkdf2($PWD, $SALT, $ITERS, ...)
          - metavariable-comparison:
              metavariable: $ITERS
              comparison: $ITERS < 600000
      - patterns:
          - pattern: "crypto.scryptSync($PWD, $SALT, $KL, { ..., N: $N, ... })"
          - metavariable-comparison:
              metavariable: $N
              comparison: $N < 32768
      - patterns:
          - pattern: "argon2.hash($PWD, { ..., memoryCost: $M, ... })"
          - metavariable-comparison:
              metavariable: $M
              comparison: $M < 19456
      - patterns:
          - pattern: "argon2.hash($PWD, { ..., timeCost: $T, ... })"
          - metavariable-comparison:
              metavariable: $T
              comparison: $T < 2

  - id: CASA3-SAST-05-weak-password-kdf-python
    languages: [python]
    message: "SAST-05: Password KDF in Python below NIST SP 800-63B §5.1.1.2 floor or with static/weak parameters (ASVS V2.4.1)"
    severity: ERROR
    pattern-either:
      - patterns:
          - pattern: bcrypt.gensalt(..., rounds=$ROUNDS, ...)
          - metavariable-comparison:
              metavariable: $ROUNDS
              comparison: $ROUNDS < 10
      - patterns:
          - pattern: hashlib.pbkdf2_hmac($ALG, $PWD, $SALT, $ITERS, ...)
          - metavariable-comparison:
              metavariable: $ITERS
              comparison: $ITERS < 600000
      - patterns:
          - pattern: hashlib.scrypt($PWD, ..., n=$N, ...)
          - metavariable-comparison:
              metavariable: $N
              comparison: $N < 32768
      - patterns:
          - pattern: PasswordHasher(..., memory_cost=$M, ...)
          - metavariable-comparison:
              metavariable: $M
              comparison: $M < 19456
      - patterns:
          - pattern: PasswordHasher(..., time_cost=$T, ...)
          - metavariable-comparison:
              metavariable: $T
              comparison: $T < 2

  - id: CASA3-SAST-06-insecure-randomness
    mode: taint
    languages: [typescript, javascript]
    message: "SAST-06: Non-CSPRNG randomness (Math.random / time-based seed) flows to a security-relevant sink (JWT secret, password, CAPTCHA, token, nonce, salt or IV) (CWE-338)"
    severity: ERROR
    pattern-sources:
      - pattern: Math.random()
      - pattern: Date.now()
      - pattern: new Date()
    pattern-sinks:
      - pattern: "expressJwt({ secret: $SINK, ... })"
      - pattern: "expressJwt({ secret: $SINK } as any)"
      - pattern: "jwt.sign($P, $SINK, ...)"
      - pattern: "password: $SINK"
      - pattern: "CaptchaModel.create({ ..., captcha: $SINK, ... })"
      - pattern: "CaptchaModel.create($SINK)"
      - pattern: "const firstTerm = $SINK"
      - pattern: "const secondTerm = $SINK"
      - pattern: "const thirdTerm = $SINK"
      - pattern: "const firstOperator = $SINK"
      - pattern: "const secondOperator = $SINK"
      - pattern: "crypto.createCipheriv($ALG, $KEY, $SINK)"
      - pattern: "crypto.pbkdf2($PWD, $SINK, ...)"
      - pattern: "crypto.pbkdf2Sync($PWD, $SINK, ...)"
      - pattern: "security.hash($SINK)"
      - pattern: |
          const makeRandomString = ($LEN: number) => {
            ...
            return $SINK
          }

  - id: CASA3-SAST-06-insecure-randomness-python
    mode: taint
    languages: [python]
    message: "SAST-06: Non-CSPRNG randomness (random.* / time.time) flows to a security-relevant sink in Python (CWE-338)"
    severity: ERROR
    pattern-sources:
      - pattern: random.random()
      - pattern: random.randint(...)
      - pattern: random.choice(...)
      - pattern: time.time()
    pattern-sinks:
      - pattern: jwt.encode($P, $SINK, ...)
      - pattern: hashlib.pbkdf2_hmac($H, $PWD, $SINK, ...)
      - pattern: "token = $SINK"
      - pattern: "secret = $SINK"

  - id: CASA3-SAST-07-mass-assignment
    languages: [typescript, javascript]
    message: "SAST-07: Mass assignment / unguarded request body passed directly to ORM model creation/update or Finale auto-binding (CWE-915, OWASP API6:2023)"
    severity: ERROR
    pattern-either:
      - pattern: "$MODEL.create(req.body, ...)"
      - pattern: "$MODEL.create(req.body)"
      - pattern: "$MODEL.update(req.body, ...)"
      - pattern: "$MODEL.create({ ...req.body, ... })"
      - pattern: "Object.assign($USER, req.body)"
      - pattern: "finale.resource(...)"

  - id: CASA3-SAST-07-mass-assignment-python
    languages: [python]
    message: "SAST-07: Mass assignment / unguarded request payload unpacked into ORM model in Python (CWE-915)"
    severity: ERROR
    pattern-either:
      - pattern: "$MODEL.objects.create(**$REQ.data)"
      - pattern: "$MODEL(**$REQ.json)"

  - id: CASA3-SAST-08-sql-injection
    languages: [typescript, javascript]
    message: "SAST-08: Unparameterized SQL or NoSQL ($where) query constructed via string interpolation or concatenation (CWE-89 / CWE-943)"
    severity: ERROR
    pattern-either:
      - pattern-regex: "sequelize\\.query\\(\\s*`[^`]*\\$\\{"
      - pattern: "sequelize.query($Q + $INPUT, ...)"
      - pattern: "$COLL.find({ $where: $EXPR + $INPUT })"
      - pattern-regex: "\\$where\\s*:\\s*`[^`]*\\$\\{"
      - pattern: "$DB.query($Q + $INPUT, ...)"

  - id: CASA3-SAST-08-sql-nosql-python
    languages: [python]
    message: "SAST-08: Unparameterized SQL query constructed via string formatting or concatenation in Python (CWE-89)"
    severity: ERROR
    pattern-either:
      - pattern: "$CURSOR.execute(f\"...\", ...)"
      - pattern: "$CURSOR.execute($Q + $INPUT, ...)"
      - pattern: "$CURSOR.execute($Q % $INPUT, ...)"
      - pattern: "$CURSOR.execute($Q.format(...), ...)"

  - id: CASA3-SAST-09-unsafe-deserialization
    languages: [typescript, javascript]
    message: "SAST-09: Unsafe deserialization of untrusted data without allowlist or integrity verification (YAML / XML-XXE NOENT+DTDLOAD / serialize) (CWE-502)"
    severity: ERROR
    pattern-either:
      - pattern: "yaml.load($DATA)"
      - pattern: "parseXmlString($DATA, ...)"
      - pattern: "libxml.parseXmlString($DATA, ...)"
      - pattern-regex: "yaml\\.load\\([^)]+\\)"
      - pattern-regex: "XML_PARSE_NOENT|XML_PARSE_DTDLOAD|XmlDocument\\.fromString"
      - pattern: "serialize.unserialize($DATA)"

  - id: CASA3-SAST-09-unsafe-deserialization-python
    languages: [python]
    message: "SAST-09: Unsafe deserialization of untrusted data in Python (pickle / yaml.load / marshal / jsonpickle) (CWE-502)"
    severity: ERROR
    pattern-either:
      - pattern: "pickle.loads(...)"
      - pattern: "pickle.load(...)"
      - pattern: "cPickle.loads(...)"
      - pattern: "marshal.loads(...)"
      - pattern: "yaml.load($DATA)"
      - pattern: "yaml.unsafe_load(...)"
      - pattern: "jsonpickle.decode(...)"

  - id: CASA3-SAST-10-dynamic-code-execution
    mode: taint
    languages: [typescript, javascript]
    message: "SAST-10: Untrusted input flows into dynamic code execution / command execution sink (eval / safeEval / Function / vm / exec) (CWE-95)"
    severity: ERROR
    pattern-sources:
      - pattern: "body.$FIELD"
      - pattern: "req.body"
      - pattern: "req.query"
      - pattern: "req.params"
      - pattern: "user.username"
    pattern-sinks:
      - pattern: eval($CODE)
      - pattern: new Function($CODE)
      - pattern: safeEval($CODE)
      - pattern: "const sandbox = { safeEval, $VAR }"
      - pattern: vm.runInNewContext($CODE, ...)
      - pattern: child_process.exec($CMD, ...)
      - pattern: child_process.execSync($CMD, ...)

  - id: CASA3-SAST-10-dynamic-code-execution-python
    mode: taint
    languages: [python]
    message: "SAST-10: Untrusted input flows into dynamic code/command execution sink in Python (eval / exec / os.system / subprocess shell=True) (CWE-95)"
    severity: ERROR
    pattern-sources:
      - pattern: request.args
      - pattern: request.form
      - pattern: request.json
      - pattern: input(...)
    pattern-sinks:
      - pattern: eval($CODE, ...)
      - pattern: exec($CODE, ...)
      - pattern: os.system($CMD)
      - pattern: subprocess.run($CMD, ..., shell=True, ...)
      - pattern: subprocess.Popen($CMD, ..., shell=True, ...)

  - id: CASA3-SAST-11-path-traversal
    mode: taint
    languages: [typescript, javascript]
    message: "SAST-11: File path constructed from unvalidated user-supplied parameter, uploaded filename or archive entry (CWE-22 / Zip Slip)"
    severity: ERROR
    pattern-sources:
      - pattern: "params.$FIELD"
      - pattern: "req.params"
      - pattern: "req.query"
      - pattern: "req.body"
      - pattern: "entry.path"
      - pattern: "file.originalname"
      - pattern: "security.cutOffPoisonNullByte(...)"
    pattern-sanitizers:
      - pattern: "path.basename(...)"
      - pattern: "sanitizeFilename(...)"
    pattern-sinks:
      - pattern: "res.sendFile(path.resolve($DIR, $SINK))"
      - pattern: "res.sendFile($SINK)"
      - pattern: "fs.readFile($SINK, ...)"
      - pattern: "fs.readFileSync($SINK, ...)"
      - pattern: "fs.createWriteStream($SINK, ...)"
      - pattern: "fs.writeFile($SINK, ...)"
      - pattern: "path.resolve($SINK)"
      - pattern: "res.render($VIEW, { ...$SINK, ... })"

  - id: CASA3-SAST-11-path-traversal-python
    mode: taint
    languages: [python]
    message: "SAST-11: File path constructed from unvalidated user input or archive member in Python (CWE-22)"
    severity: ERROR
    pattern-sources:
      - pattern: "request.args"
      - pattern: "request.form"
      - pattern: "member.filename"
    pattern-sanitizers:
      - pattern: "os.path.basename(...)"
      - pattern: "secure_filename(...)"
    pattern-sinks:
      - pattern: "open($SINK, ...)"
      - pattern: "send_file($SINK, ...)"

  - id: CASA3-SAST-12-hardcoded-config-secrets
    languages: [typescript, javascript, terraform]
    message: "SAST-12: Server-side secret or key hardcoded in configuration, IaC or source instead of managed secret store (CWE-522 / ASVS V6.4.1)"
    severity: ERROR
    pattern-regex: "(jwt\\.pub|privateKey\\s*=\\s*['\"]-----BEGIN|private_key\\s*=\\s*\"-----BEGIN|createHmac\\(['\"]sha256['\"]\\s*,\\s*['\"][A-Za-z0-9]{12,})"

  - id: CASA3-SAST-13-sensitive-logging
    mode: taint
    languages: [typescript, javascript]
    message: "SAST-13: Credentials, session tokens or payment details flow unmasked into logging/URL-logged sink (CWE-532 / ASVS V7.1.1)"
    severity: ERROR
    pattern-sources:
      - pattern: "$REQ.body.password"
      - pattern: "$REQ.headers.authorization"
      - pattern: "$REQ.cookies.token"
      - pattern: "query.current"
      - pattern: "query.new"
      - pattern: "$USER.password"
      - pattern: "$CARD.cardNum"
    pattern-sanitizers:
      - pattern: "sha256(...)"
      - pattern: "mask(...)"
      - pattern: "$X.replace(/./g, '*')"
    pattern-sinks:
      - pattern: "logger.info(...)"
      - pattern: "logger.warn(...)"
      - pattern: "logger.error(...)"
      - pattern: "logger.debug(...)"
      - pattern: "console.log(...)"
      - pattern: "console.error(...)"
      - pattern: "console.warn(...)"

  - id: CASA3-SAST-13-get-password-query-logged
    languages: [typescript, javascript]
    message: "SAST-13: Passwords transmitted via HTTP GET query parameters (query.current/query.new) which are written verbatim to HTTP access logs (morgan combined) (CWE-532 / CWE-598)"
    severity: ERROR
    pattern: |
      const $CUR = query.current as string
      ...
      const $NEW = query.new as string

  - id: CASA3-SAST-13-sensitive-logging-python
    mode: taint
    languages: [python]
    message: "SAST-13: Sensitive credential/token/card flows unmasked to log sink in Python (CWE-532)"
    severity: ERROR
    pattern-sources:
      - pattern: "password"
      - pattern: "authorization"
      - pattern: "access_token"
      - pattern: "card_number"
    pattern-sinks:
      - pattern: "logging.info(...)"
      - pattern: "logging.error(...)"
      - pattern: "logging.debug(...)"
      - pattern: "logger.info(...)"
      - pattern: "print(...)"
