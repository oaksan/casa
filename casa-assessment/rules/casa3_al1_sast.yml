rules:
  - id: CASA3-SAST-01-hardcoded-secret
    languages: [typescript, javascript, python]
    message: "SAST-01: Hardcoded password, API key, HMAC secret, JWT signing secret or credential in source code (CWE-798)"
    severity: ERROR
    pattern-either:
      - pattern: |
          const $KEY = '-----BEGIN RSA PRIVATE KEY-----...'
      - pattern: |
          jwt.sign($PAYLOAD, "...", ...)
      - pattern: |
          crypto.createHmac($ALG, "...")
      - pattern: |
          $REQ.body.password === "..."
      - pattern: |
          { [Op.like]: '%6PPi37DBxP4lDwlriuaxP15HaDJpsUXY5TspVmie%' }

  - id: CASA3-SAST-02-committed-private-key
    languages: [typescript, javascript, python]
    message: "SAST-02: Private key, HDWallet BIP-39 mnemonic seed or trust material committed in source code (CWE-321)"
    severity: ERROR
    pattern-either:
      - pattern-regex: "-----BEGIN (RSA |EC |OPENSSH |DSA |ENCRYPTED )?PRIVATE KEY-----"
      - pattern: HDNodeWallet.fromPhrase("...")
      - pattern: ethers.Wallet.fromPhrase("...")

  - id: CASA3-SAST-03-weak-cipher
    languages: [typescript, javascript]
    message: "SAST-03: Deprecated or broken cipher algorithm (DES, 3DES, RC4, Blowfish) or insecure ECB mode (CWE-327)"
    severity: ERROR
    pattern-either:
      - pattern: crypto.createCipher($ALG, ...)
      - pattern: crypto.createDecipher($ALG, ...)
      - pattern: CryptoJS.DES.encrypt(...)
      - pattern: CryptoJS.TripleDES.encrypt(...)
      - pattern: CryptoJS.RC4.encrypt(...)
      - pattern-regex: "(?i)(?:createCipheriv|createDecipheriv)\\s*\\(\\s*['\"](?:des|des3|des-ede|des-ede3|desx|rc4|bf|blowfish|[a-z0-9-]+-ecb)"
      - pattern-regex: "(?i)CryptoJS\\.mode\\.ECB"

  - id: CASA3-SAST-03-weak-cipher-python
    languages: [python]
    message: "SAST-03: Deprecated or broken cipher algorithm (DES, 3DES, RC4, Blowfish) or insecure ECB mode in Python (CWE-327)"
    severity: ERROR
    pattern-either:
      - pattern: Crypto.Cipher.DES.new(...)
      - pattern: Crypto.Cipher.DES3.new(...)
      - pattern: Crypto.Cipher.ARC4.new(...)
      - pattern: Crypto.Cipher.Blowfish.new(...)
      - pattern: AES.new($KEY, AES.MODE_ECB, ...)
      - pattern: cryptography.hazmat.primitives.ciphers.modes.ECB()

  - id: CASA3-SAST-04-weak-hash
    languages: [typescript, javascript]
    message: "SAST-04: Weak hash function (MD5 or SHA-1) used in security-relevant context (HMAC/signature, password, token or integrity sink) (CWE-328)"
    severity: ERROR
    pattern-either:
      - pattern: crypto.createHash('md5')
      - pattern: crypto.createHash('sha1')
      - pattern: crypto.createHmac('md5', ...)
      - pattern: crypto.createHmac('sha1', ...)
      - pattern: CryptoJS.MD5(...)
      - pattern: CryptoJS.SHA1(...)
      - pattern: $SEC.hash($PASSWORD)

  - id: CASA3-SAST-04-weak-hash-python
    languages: [python]
    message: "SAST-04: Weak hash function (MD5 or SHA-1) used in security-relevant context in Python (CWE-328)"
    severity: ERROR
    pattern-either:
      - pattern: hashlib.md5(...)
      - pattern: hashlib.sha1(...)
      - pattern: hmac.new($KEY, $MSG, hashlib.md5)
      - pattern: hmac.new($KEY, $MSG, hashlib.sha1)

  - id: CASA3-SAST-05-weak-password-kdf
    languages: [typescript, javascript]
    message: "SAST-05: Password persistence sink uses fast/unsalted hash instead of memory-hard KDF (Argon2id, scrypt, bcrypt, PBKDF2 >= 600k) with per-user CSPRNG salt (ASVS V2.4.1)"
    severity: ERROR
    pattern-either:
      - pattern: |
          export const hash = ($DATA) => crypto.createHash('md5').update($DATA).digest('hex')
      - pattern: |
          this.setDataValue('password', $HASH_FN($PWD))
      - pattern: |
          crypto.pbkdf2Sync($PWD, "...", ...)
      - pattern: |
          crypto.pbkdf2($PWD, "...", ...)

  - id: CASA3-SAST-06-insecure-randomness
    languages: [typescript, javascript]
    message: "SAST-06: Insecure PRNG (Math.random) used instead of CSPRNG (crypto.randomBytes / crypto.randomUUID) (CWE-338)"
    severity: ERROR
    pattern: Math.random()

  - id: CASA3-SAST-07-mass-assignment
    languages: [typescript, javascript]
    message: "SAST-07: Mass assignment / unguarded request body passed directly to ORM model creation or Finale auto-binding (CWE-915)"
    severity: ERROR
    pattern-either:
      - pattern: "$MODEL.create(req.body, ...)"
      - pattern: "$MODEL.create(req.body)"
      - pattern: "Object.assign($USER, req.body)"
      - pattern: "finale.resource(...)"

  - id: CASA3-SAST-08-sql-injection
    languages: [typescript, javascript]
    message: "SAST-08: Unparameterized SQL query constructed via string interpolation/concatenation (CWE-89)"
    severity: ERROR
    pattern-regex: "sequelize\\.query\\(\\s*`[^`]*\\$\\{"

  - id: CASA3-SAST-09-unsafe-deserialization
    languages: [typescript, javascript]
    message: "SAST-09: Unsafe deserialization of untrusted data (yaml.load / libxmljs / serialize) (CWE-502)"
    severity: ERROR
    pattern-either:
      - pattern: "yaml.load($DATA)"
      - pattern: "libxml.parseXmlString($DATA, ...)"

  - id: CASA3-SAST-10-dynamic-code-execution
    languages: [typescript, javascript]
    message: "SAST-10: Dynamic code execution (eval / vm.runInContext / new Function) on untrusted input (CWE-95)"
    severity: ERROR
    pattern-either:
      - pattern: eval($CODE)
      - pattern: vm.runInContext($CODE, ...)
      - pattern: vm.runInNewContext($CODE, ...)

  - id: CASA3-SAST-11-path-traversal
    languages: [typescript, javascript]
    message: "SAST-11: File path constructed from unvalidated user-supplied parameter (CWE-22)"
    severity: ERROR
    pattern-either:
      - pattern: res.sendFile(path.resolve($DIR, $USER_INPUT))
      - pattern: fs.readFile(path.resolve($DIR, $USER_INPUT), ...)

  - id: CASA3-SAST-12-hardcoded-config-secrets
    languages: [typescript, javascript]
    message: "SAST-12: Server-side secret or key hardcoded in configuration or source instead of managed secret store (CWE-522)"
    severity: ERROR
    pattern-regex: "(jwt\\.pub|privateKey\\s*=\\s*['\"]-----BEGIN)"

  - id: CASA3-SAST-13-sensitive-logging
    languages: [typescript, javascript]
    message: "SAST-13: Potential logging of sensitive user or authentication data (CWE-532)"
    severity: ERROR
    pattern-either:
      - pattern: logger.info($MSG + $REQ.body.password)
      - pattern: console.log(..., $REQ.headers.authorization, ...)
